[workspace]
members = ["crates/sim", "crates/session", "crates/client", "apps/desktop", "apps/web", "apps/web/worker", "tools/rtc"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.95"
version = "0.1.0"
publish = false

[workspace.dependencies]
tc-sim = { path = "crates/sim" }
tc-session = { path = "crates/session" }
tc-client = { path = "crates/client" }
bevy = { version = "=0.19.0", default-features = false, features = [
    "std", "default_app", "3d_bevy_render", "scene", "bevy_winit",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "=0.2.130"
